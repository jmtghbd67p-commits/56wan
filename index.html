function tripTime(p){const drive=`${p.route_estimated?"예상 ":"차량 "}${p.route_minutes}분`;return p.transit_minutes!=null?`${drive} · 대중 ${p.transit_minutes}분`:drive}function previewRows(t){const a=t.items||[],s=a.length?S.previewOffset%a.length:0,r=Array.from({length:Math.min(3,a.length)},(_,i)=>a[(s+i)%a.length]);return r.length?r.map((p,i)=>`<button class="rank-row" onclick="openTheme('${t.key}')"><span class="rank-no">${i+1}</span><span class="rank-name">${esc(p.name)}</span><span class="rank-meta">${tripTime(p)}</span></button>`).join(""):`<div class="rank-empty">이 조건에서 적당한 후보를 찾지 못했습니다.</div>`}function renderPreviews(){navSet("home");const h=S.second?"두 번째 메인도 골라주세요":`${chosenDateLabel()}에는 이렇게 놀아보세요`;render(`${back(S.second?"renderThemeItems()":"home()",S.second?"첫 번째 메인으로":"조건 다시 선택")}<div class="section">${h}</div><div class="hint">테마는 유지하고, 차량·대중교통 이동시간 기준 상위 3곳을 먼저 보여드려요.</div>${S.previews.map(t=>`<div class="card theme-card"><div class="theme-head">${themeIcon(t)}<div><div class="theme-title">${esc(t.title)}</div><div class="theme-copy">${esc(t.description)}</div></div><button class="theme-more" onclick="openTheme('${t.key}')">더 보기 ${icon("chevron-right")}</button></div><div class="rank-list">${previewRows(t)}</div><div class="theme-footer"><button onclick="openTheme('${t.key}')">${esc(t.title)} 후보 전체 보기 ${icon("arrow-right")}</button></div></div>`).join("")}<button class="refresh" onclick="refreshPreviews()">${icon("refresh-cw")} 같은 테마의 다른 장소 보기</button><div class="card all-themes"><b>다른 테마로 바로 찾기</b><div class="hint" style="margin:5px 0 8px">영화·공연과 축제는 정확한 실시간 편성 데이터가 연결되기 전까지 후보를 제시하지 않습니다.</div><div class="chips">${Object.entries(ALL_THEMES).map(([k,t])=>`<button class="soft-btn" onclick="openTheme('${k}')">${icon(t[0])} ${t[1]}</button>`).join("")}</div></div>`)}function refreshPreviews(){const m=Math.max(0,...S.previews.map(t=>(t.items||[]).length));if(m<=3){alert("이 조건에서 더 바꿔 보여드릴 후보가 많지 않습니다.");return}S.previewOffset=(S.previewOffset+3)%m;renderPrevi async function openTheme(k){S.theme=k;if(["show","festival"].includes(k)){const t=ALL_THEMES[k];render(`${back("renderPreviews()","추천 테마로")}<div class="section">${icon(t[0])} ${t[1]}</div><div class="card hint">선택 날짜의 상영·공연·행사를 정확히 반영할 공식 실시간 데이터 연결 전입니다. 부정확한 후보는 표시하지 않습니다.</div>`);return}load(`${ALL_THEMES[k]?.[1]||"테마"} 후보를 찾고 있어요`);try{const o=await resolveOrigin(),d=await api("/api/app?mode=theme",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...o,originLabel:S.origin==="직접 입력"?S.originText.trim():"",theme:k,age:S.age,maxMinutes:S.drive===30?40:75})});S.transitEnabled=d.transitEnabled;S.items=d.items;if(!S.items.length)throw Error("이 테마에서는 조건에 맞는 후보를 찾지 못했습니다.");renderThemeItems()}catch(e){fail(e.message)}}function placeCard(p,c=true){return `<div class="card place"><h3>${esc(p.name)}</h3><div class="meta">${icon("car-front")} ${p.route_estimated?"예상 ":"실제 차량 약 "}${p.route_minutes}분${p.transit_minutes!=null?`<br>${icon("bus-front")} 대중교통 약 ${p.transit_minutes}분`:""} · ${esc(p.category||"장소")}<br>${esc(p.road_address||p.address||"")}</div>${p.family_evidence?`<span class="tag">아이 동반 후기·시설 언급 ${p.family_evidence}건 반영</span>`:""}<span class="tag">영업시간·예약은 외부 페이지에서 최종 확인</span><div class="place-actions"><a class="link-btn" target="_blank" rel="noopener" href="${p.place_url||`https://m.search.naver.com/search.naver?query=${encodeURIComponent(p.name)}`}">${icon("map-pinned")} 지도 보기</a><a class="link-btn" target="_blank" rel="noopener" href="https://m.search.naver.com/search.naver?query=${encodeURIComponent(p.name)}">${icon("arrow-up-right")} 리뷰·예약</a>${c?`<button class="select" onclick="chooseMain('${p.id}')">선택 ${icon("chevron-right")}</button>`:""}</div></div>`}function renderThemeItems(){const t=ALL_THEMES[S.theme]||["map-pin","추천 장소",""];render(`${back("renderPreviews()","추천 테마로")}<div class="list-title"><div><div class="section" style="margin-bottom:4px">${icon(t[0])} ${t[1]}</div><div class="hint">테마 기준을 통과한 후보입니다.</div></div></div>${S.items.map(p=>placeCard(p)).join("")}`)}function chooseMain(id){const p=S.items.find(x=>x.id===id);if(!p)return;if(S.second){S.main2=p;S.second=false;around();return}S.main1=p;S.main2=null;S.pick={sub:null,food:null,cafe:null};if(S.period==="종일"){S.second=true;renderPreviews()}else around()}
async function around(){load("메인 장소 주변의 보조 콘텐츠·식당·카페를 찾고 있어요");try{const o={x:S.main1.x,y:S.main1.y},r=await Promise.all(["sub","food","cafe"].map(type=>api("/api/app?mode=nearby",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...o,type})})));S.near={sub:r[0].items,food:r[1].items,cafe:r[2].items};renderAround()}catch(e){fail(e.message)}}function mini(p,t){const on=S.pick[t]?.id===p.id;return `<div class="card mini ${on?"choice":""}"><h3>${esc(p.name)}</h3><div class="meta">${icon("car-front")} 메인에서 약 ${p.route_minutes}분 · ${esc(p.category||"")}</div><button class="select" onclick="pickNear('${t}','${p.id}')">${on?"선택됨":"선택"} ${icon(on?"check":"chevron-right")}</button></div>`}function renderAround(){render(`${back(S.period==="종일"?"renderPreviews()":"renderThemeItems()","메인 다시 고르기")}<div class="section">선택한 메인</div>${placeCard(S.main1,false)}${S.main2?`<div class="section">두 번째 메인</div>${placeCard(S.main2,false)}`:""}<div class="section">보조 콘텐츠</div><div class="hint">시간이 남을 때만 하나를 더 골라 주세요.</div>${S.near.sub.slice(0,5).map(p=>mini(p,"sub")).join("")||'<div class="card hint">적당한 보조 콘텐츠가 없습니다.</div>'}<div class="section">${icon("utensils")} 식당</div>${S.near.food.slice(0,5).map(p=>mini(p,"food")).join("")||'<div class="card hint">조건에 맞는 식당이 없습니다.</div>'}<div class="section">${icon("coffee")} 카페</div>${S.near.cafe.slice(0,5).map(p=>mini(p,"cafe")).join("")||'<div class="card hint">조건에 맞는 카페가 없습니다.</div>'}<button class="primary" onclick="finalPlan()">선택한 내용으로 일정 보기 ${icon("arrow-right")}</button>`)}function pickNear(t,id){const p=S.near[t].find(x=>x.id===id);S.pick[t]=S.pick[t]?.id===id?null:p;renderAround()}function timeOf(i){return(S.period==="오전"?["10:00","11:30","12:20","-"]:S.period==="오후"?["14:00","15:30","17:00","-"]:["10:00","12:20","14:00","16:20","17:30"])[i]||"-"}function finalPlan(){const o=S.period==="종일"?[S.main1,S.pick.food,S.main2,S.pick.sub,S.pick.cafe]:[S.main1,S.pick.sub,S.pick.food,S.pick.cafe],x=o.filter(Boolean);rend function settings(){navSet("settings");render(`<div class="section">설정</div><div class="card"><b>우리집 위치</b><div class="hint" style="margin-top:5px">${S.home?"저장됨":"아직 저장되지 않음"}</div><button class="soft-btn" style="width:100%;justify-content:center;margin-top:11px" onclick="saveHome()">${icon("locate-fixed")} 현재 위치를 우리집으로 저장</button></div>`)}async function saveHome(){try{const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(x=>ok({x:x.coords.longitude,y:x.coords.latitude}),()=>no(Error("현재 위치 권한을 허용해 주세요.")),{enableHighAccuracy:true,timeout:10000}));S.home=p;LS.set("lt_home",p);settings()}catch(e){alert(e.message)}}
function closeMap(){modal.innerHTML=""}function openMap(){modal.innerHTML=`<div class="modal map-modal"><section class="sheet map-sheet"><div class="map-toolbar"><div class="map-title"><b>출발지를 지도에서 선택</b><span>전국 어디든 원하는 위치를 한 번 눌러 주세요.</span></div><button class="close" aria-label="지도 닫기" onclick="closeMap()">${icon("x")}</button></div><div id="map" class="map"></div><div class="map-bottom"><div id="map-status" class="map-status">지도를 불러오는 중…</div><div class="map-foot">${S.home?`<button class="soft-btn" onclick="focusMapHome()">${icon("locate-fixed")} 우리집</button>`:""}<button id="map-confirm" class="primary" disabled onclick="confirmMapPick()">이 위치로 선택 ${icon("arrow-right")}</button></div></div></section></div>`;paintIcons();setTimeout(initMap,0)}let activeMap=null;function initMap(){if(!window.L){document.getElementById("map-status").textContent="지도를 불러오지 못했습니다. 직접 입력을 이용해 주세요.";return}const saved=S.mapPick||S.home,i=saved||{x:127.7669,y:35.9078},mi=L.divIcon({className:"origin-marker",html:"<span></span>",iconSize:[26,26],iconAnchor:[13,26]}),m=L.map("map",{zoomControl:false,attributionControl:true}).setView([i.y,i.x],saved?13:7);activeMap=m;L.control.zoom({position:"bottomright"}).addTo(m);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(m);let mark=S.mapPick?L.marker([S.mapPick.y,S.mapPick.x],{icon:mi}).addTo(m):null,st=document.getElementById("map-status"),c=document.getElementById("map-confirm");const set=e=>{const p={x:+e.latlng.lng.toFixed(6),y:+e.latlng.lat.toFixed(6)};S.mapPick=p;if(mark)mark.setLatLng(e.latlng);else mark=L.marker(e.latlng,{icon:mi}).addTo(m);st.textContent="선택한 위치를 출발지로 사용합니다.";c.disabled=false};m.on("click",set);if(S.mapPick){st.textContent="선택한 위치를 출발지로 사용합니다.";c.disabled=false}setTimeout(()=>m.invalidateSize(),150)}function focusMapHome(){if(activeMap&&S.home)activeMap.flyTo([S.home.y,S.home.x],15,{duration:.45})}function confirmMapPick(){if(!S.mapPick)return;S.origin="지도에서 선택";S.originPos=S.mapPick;closeMap();home()}function tripTime(p){return `${p.route_estimated?"예상 ":"차량 "}${p.route_minutes}분`}const carOnlyHome=home;home=()=>{carOnlyHome();main.innerHTML=main.innerHTML.replace('차량 또는 대중교통 중 하나라도 범위에 들어오면 포함합니다. 약 30분은 40분까지, 약 1시간은 75분까지입니다.','차량 실제 이동시간 기준입니다. 약 30분은 40분까지, 약 1시간은 75분까지 포함합니다.').replace('data-lucide="route"','data-lucide="car-front"').replace('이동시간','메인까지');requestAnimationFrame(paintIcons)};document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>n.dataset.page==="home"?home():settings());home();paintIcons();
</script></body></html>
