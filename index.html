<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>오육완</title></head><body><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/jmtghbd67p-commits/56wan/main/index.html',{cache:'no-store'});let h=await r.text();const css=`<style>.top{position:sticky!important;top:0!important;z-index:29!important;background:rgba(251,250,248,.96)!important;-webkit-backdrop-filter:blur(14px)!important;backdrop-filter:blur(14px)!important;border-bottom:1px solid rgba(232,232,234,.82)!important}.selected-visit-date{display:inline-flex;align-items:center;margin:0 0 10px;padding:6px 9px;border-radius:10px;background:#eef3ff;color:#385b9d;font-size:12px;font-weight:800}</style>`;h=h.replace('</head>',css+'</head>');const patch=`<script>try{if(!USER_THEME_KEYS.includes('water'))USER_THEME_KEYS.push('water');ALL_THEMES.season=['sparkles','지역축제',''];ALL_THEMES.water=['life-buoy','물놀이',''];needsVisitDate=()=>S.themes.includes('culture')||S.themes.includes('season')||S.themes.includes('water');renderThemeItems=()=>{const selectedBadges=S.themes.map(key=>'<span class="selected-theme-badge">'+esc(ALL_THEMES[key]?.[1]||key)+'</span>').join('');const dateBadge=needsVisitDate()?'<div class="selected-visit-date">'+icon('calendar-days')+' 방문일 · '+esc(cultureDateLabel(S.cultureDate))+'</div>':'';navSet('back');const more=!!S.hasMoreRecommendations;render('<div class="list-title"><div><div class="section selected-theme-heading">'+selectedBadges+'</div>'+dateBadge+'</div></div>'+S.items.map(place=>placeCard(place)).join('')+'<button class="refresh" '+(more?'':'disabled')+' onclick="'+(more?'refreshThemeItems()':'')+'">'+icon(more?'refresh-cw':'check')+' '+(more?'다른 후보 보기':'모든 추천을 확인했어요')+'</button>');requestAnimationFrame(paintIcons)};setTimeout(()=>home(),0)}catch(e){console.error(e)}<\/script>`;h=h.replace('</body>',patch+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.textContent='오육완을 불러오지 못했습니다.'}})();</script></body></html>
