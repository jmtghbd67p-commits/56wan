<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf4"><title>아이랑 어디갈까?</title>
<style>
:root{--bg:#fffaf4;--ink:#252421;--mut:#79736c;--line:#ece4da;--soft:#f5f0ea;--nv:#03c75a;--good:#edf7ee;--bad:#fff0ef}
*{box-sizing:border-box}body{margin:0;background:#eee9e3;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
.app{max-width:540px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:70px}.top{padding:22px 18px 11px}.brand{font-size:25px;font-weight:900}.sub{font-size:12px;color:var(--mut);margin-top:5px}
main{padding:0 16px 26px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.label{font-size:13px;font-weight:900;color:#625d57;margin:14px 0 8px}.chips{display:flex;gap:7px;flex-wrap:wrap}
button,input,textarea{font:inherit}.chip,.ghost{border:0;background:var(--soft);border-radius:11px;padding:10px 12px;color:#625d57}.chip.on{background:var(--ink);color:#fff;font-weight:900}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.primary,.select{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:12px;font-weight:900}.primary{width:100%;font-size:15px}.section{font-size:20px;font-weight:900;margin:19px 2px 7px}.hint,.meta{font-size:11px;color:var(--mut);line-height:1.55}.place h3{margin:0 0 6px;font-size:17px}
.photos{display:grid;grid-template-columns:1.25fr 1fr;gap:6px;margin:9px 0}.photos a{display:block;height:112px;border-radius:12px;overflow:hidden;background:#eee}.photos img{width:100%;height:100%;object-fit:cover}.noimg{height:100px;border-radius:12px;background:linear-gradient(135deg,#e7ded3,#dbe7e0);display:flex;align-items:center;justify-content:center;font-size:28px}
.naverbox{background:#f8fbf8;border:1px solid #e2eee3;border-radius:12px;padding:10px;margin-top:9px}.navertitle{font-size:11px;font-weight:900;color:#126d37;margin-bottom:5px}.nitem{padding:6px 0;border-bottom:1px solid #e5eee7}.nitem:last-child{border:0}.nitem a{color:#2d2b29;text-decoration:none;font-size:11px;font-weight:800}.ndesc{font-size:10px;color:#736e68;line-height:1.4;margin-top:2px}
.ops{background:#fff8ec;border-radius:10px;padding:8px 9px;margin-top:8px}.ops b{font-size:11px}.actions{display:flex;gap:7px;margin-top:9px}.actions>*{flex:1}.naverbtn{border:0;background:var(--nv);color:#fff;border-radius:11px;padding:11px;font-weight:900}.refresh{width:100%;border:1px dashed #c9beb1;background:#fff;border-radius:13px;padding:12px;font-weight:900;margin-top:10px}.back{border:0;background:none;color:#6d675f;padding:7px 0;font-weight:800}
.choice{border:2px solid var(--ink)}.tag{display:inline-block;background:var(--soft);border-radius:7px;padding:4px 7px;font-size:10px;margin:3px 3px 0 0}.tag.good{background:var(--good)}.tag.bad{background:var(--bad)}
.loading{text-align:center;padding:45px 10px;color:var(--mut)}.spin{width:28px;height:28px;border:3px solid #ddd;border-top-color:#333;border-radius:50%;margin:0 auto 10px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{background:#fff0ef;color:#963c34;padding:11px;border-radius:11px;font-size:12px;line-height:1.5}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);height:64px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}.nav{flex:1;border:0;background:#fff;color:#8b857d;font-size:11px}.nav.on{color:#222;font-weight:900}
.admin textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:9px;padding:8px}.adminrow{display:flex;gap:6px;margin:7px 0}.adminrow button{flex:1;border:0;border-radius:9px;padding:9px}.rec{background:var(--good)}.not{background:var(--bad)}
</style></head><body><div class="app"><div class="top"><div class="brand">아이랑 어디갈까?</div><div class="sub">실제 이동시간은 카카오, 사진·후기 검색결과는 네이버</div></div><main id="main"></main>
<nav class="bottom"><button class="nav on" data-page="home">⌂<br>홈</button><button class="nav" data-page="saved">♡<br>찜목록</button><button class="nav" data-page="admin">⚙<br>관리</button></nav></div>
<script>
const main=document.getElementById("main"), LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let S={date:"오늘",age:"3~4세",period:"오전",nap:"필요",drive:30,origin:"우리집",originText:"",home:LS.g("lt_home",null),originPos:null,candidates:[],offset:0,main1:null,main2:null,near:{sub:[],food:[],cafe:[]},pick:{sub:null,food:null,cafe:null},saved:LS.g("lt_saved",[]),admin:LS.g("lt_admin",{})};
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function strip(s=""){return String(s).replace(/<[^>]*>/g,"").replace(/&quot;/g,'"').replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")}
function navSet(p){document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x.dataset.page===p))}
function load(t){main.innerHTML=`<div class="loading"><div class="spin"></div>${esc(t)}</div>`}
function err(t){main.innerHTML=`<div class="err">${esc(t)}</div><button class="primary" style="margin-top:10px" onclick="home()">홈으로</button>`}
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"API 오류");return d}
function setv(k,v){S[k]=v;home()}
function home(){navSet("home");main.innerHTML=`<div class="card">
<div class="label">📍 어디에서 출발할까요?</div><div class="chips">${["우리집","현재 위치","직접 입력"].map(x=>`<button class="chip ${S.origin===x?"on":""}" onclick="setOrigin('${x}')">${x}</button>`).join("")}</div>
${S.origin==="우리집"?`<div class="hint" style="margin-top:6px">${S.home?"우리집 위치 저장됨":"관리 메뉴에서 현재 위치를 우리집으로 한 번 저장해 주세요."}</div>`:""}
${S.origin==="직접 입력"?`<input class="input" style="margin-top:8px" value="${esc(S.originText)}" placeholder="주소나 장소명" oninput="S.originText=this.value">`:""}
<div class="label">📅 언제?</div><div class="chips">${["오늘","내일","주말"].map(x=>`<button class="chip ${S.date===x?"on":""}" onclick="setv('date','${x}')">${x}</button>`).join("")}</div>
<div class="label">👶 아이 나이</div><div class="chips">${["1~2세","3~4세","5~6세","7세+"].map(x=>`<button class="chip ${S.age===x?"on":""}" onclick="setv('age','${x}')">${x}</button>`).join("")}</div>
<div class="label">🕐 일정</div><div class="chips">${["오전","오후","종일"].map(x=>`<button class="chip ${S.period===x?"on":""}" onclick="setv('period','${x}')">${x}</button>`).join("")}</div>
<div class="label">😴 낮잠</div><div class="chips">${["필요","필요 없음"].map(x=>`<button class="chip ${S.nap===x?"on":""}" onclick="setv('nap','${x}')">${x}</button>`).join("")}</div>
<div class="label">🚗 메인 콘텐츠까지</div><div class="chips"><button class="chip ${S.drive===30?"on":""}" onclick="setv('drive',30)">약 30분</button><button class="chip ${S.drive===60?"on":""}" onclick="setv('drive',60)">약 1시간</button></div>
<div class="hint">'약 30분'은 차량 약 40분까지, '약 1시간'은 약 1시간 15분까지 포함합니다.</div>
<button class="primary" style="margin-top:14px" onclick="searchMain()">실제 장소 추천받기</button></div>`}
function setOrigin(x){S.origin=x;home()}
async function origin(){
 if(S.origin==="우리집"){if(!S.home)throw Error("관리 메뉴에서 우리집 위치를 먼저 저장해 주세요.");return S.home}
 if(S.origin==="현재 위치")return await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok({x:p.coords.longitude,y:p.coords.latitude}),()=>no(Error("현재 위치 권한을 허용해 주세요.")),{enableHighAccuracy:true,timeout:10000}));
 if(!S.originText.trim())throw Error("출발지를 입력해 주세요.");
 return (await api(`/api/app?mode=geocode&q=${encodeURIComponent(S.originText.trim())}`)).origin;
}
async function searchMain(){load("주변 장소를 찾고 실제 차량시간을 계산하고 있어요");try{S.originPos=await origin();const maxMinutes=S.drive===30?40:75;const d=await api("/api/app?mode=main",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...S.originPos,age:S.age,maxMinutes})});S.candidates=d.items.filter(x=>S.admin[x.id]?.status!=="not");S.offset=0;if(!S.candidates.length)throw Error("조건 안에서 후보를 찾지 못했습니다.");listMain()}catch(e){err(e.message)}}
function adminTag(p){const a=S.admin[p.id]||{};return `${a.status?`<span class="tag ${a.status==="rec"?"good":"bad"}">관리자 ${a.status==="rec"?"추천":"비추천"}</span>`:""}${a.note?`<span class="tag good">${esc(a.note)}</span>`:""}`}
function baseCard(p,choose=true){return `<div class="card place ${S.admin[p.id]?.status==="rec"?"choice":""}" id="card_${p.id}"><h3>${esc(p.name)}</h3><div class="meta">🚗 실제 차량 약 ${p.route_minutes}분 · ${esc(p.category||"")}<br>${esc(p.road_address||p.address||"")}</div>${adminTag(p)}<div id="nv_${p.id}"><div class="hint" style="margin-top:9px">네이버 사진·후기 검색결과 불러오는 중…</div></div><div class="actions"><button class="naverbtn" onclick="openNaver('${esc(p.name)}')">네이버에서 보기</button>${choose?`<button class="select" onclick="chooseMain('${p.id}')">선택</button>`:""}</div></div>`}
function listMain(){navSet("home");const xs=S.candidates.slice(S.offset,S.offset+6);main.innerHTML=`<button class="back" onclick="home()">← 조건 다시 선택</button><div class="section">오늘 갈 메인 콘텐츠</div><div class="hint">추천 순위는 카카오 장소·실제 차량시간으로 계산합니다. 아래 네이버 검색결과는 참고정보입니다.</div>${xs.map(x=>baseCard(x)).join("")}<button class="refresh" onclick="next6()">🔄 마음에 드는 곳이 없어요 · 다른 6곳 추천</button>`;xs.forEach(enrich)}
function next6(){if(S.offset+6<S.candidates.length)S.offset+=6;else S.offset=0;listMain()}
function openNaver(name){window.open(`https://m.search.naver.com/search.naver?query=${encodeURIComponent(name)}`,"_blank")}
async function enrich(p){try{const d=(await api(`/api/app?mode=naver&name=${encodeURIComponent(p.name)}&address=${encodeURIComponent(p.road_address||p.address||"")}`)).data;const el=document.getElementById("nv_"+p.id);if(el)el.innerHTML=naverBox(d,p)}catch(e){const el=document.getElementById("nv_"+p.id);if(el)el.innerHTML=`<div class="hint">네이버 검색결과를 불러오지 못했습니다.</div>`}}
function naverBox(d,p){const imgs=(d.images||[]).slice(0,2);const blogs=(d.blogs||[]).slice(0,3),cafes=(d.cafes||[]).slice(0,2),ops=(d.operations||[]).slice(0,2);
return `<div class="naverbox"><div class="navertitle">NAVER 검색결과</div>${imgs.length?`<div class="photos">${imgs.map(x=>`<a href="${x.link}" target="_blank" rel="noopener"><img src="${x.thumbnail||x.link}" alt=""></a>`).join("")}</div>`:`<div class="noimg">📷</div>`}
${ops.length?`<div class="ops"><b>영업시간·휴무 관련 검색결과</b>${ops.map(x=>`<div class="nitem"><a href="${x.link}" target="_blank">${esc(strip(x.title))}</a><div class="ndesc">${esc(strip(x.description||""))}</div></div>`).join("")}</div>`:`<div class="ops"><b>영업시간</b><div class="ndesc">공식 검색 API에서 구조화된 영업시간을 제공하지 않아 네이버에서 최종 확인이 필요합니다.</div></div>`}
${blogs.length||cafes.length?`<div style="margin-top:8px"><div class="navertitle">블로그·카페 후기 검색결과</div>${[...blogs,...cafes].slice(0,5).map(x=>`<div class="nitem"><a href="${x.link}" target="_blank">${esc(strip(x.title))}</a><div class="ndesc">${esc(strip(x.description||""))}</div></div>`).join("")}</div>`:""}
${d.booking?`<a class="naverbtn" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="${d.booking.link}" target="_blank">네이버 예약</a>`:""}<div class="hint" style="margin-top:6px">사진·후기·운영정보 검색결과: NAVER API HUB</div></div>`}
function chooseMain(id){S.main1=S.candidates.find(x=>x.id===id);S.pick={sub:null,food:null,cafe:null};if(S.period==="종일")secondMain();else around()}
function secondMain(){const xs=S.candidates.filter(x=>x.id!==S.main1.id).slice(0,8);main.innerHTML=`<button class="back" onclick="listMain()">← 첫 메인 다시 고르기</button><div class="section">종일 일정이라 메인 콘텐츠를 하나 더 골라주세요</div>${baseCard(S.main1,false)}${xs.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="meta">출발지에서 ${x.route_minutes}분 · ${esc(x.category)}</div><button class="select" style="width:100%;margin-top:7px" onclick="pickSecond('${x.id}')">두 번째 메인 선택</button></div>`).join("")}`;enrich(S.main1)}
function pickSecond(id){S.main2=S.candidates.find(x=>x.id===id);around()}
async function around(){load("메인 장소 주변 보조 콘텐츠·식당·카페를 찾고 있어요");try{const o={x:S.main1.x,y:S.main1.y};const [sub,food,cafe]=await Promise.all(["sub","food","cafe"].map(type=>api("/api/app?mode=nearby",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...o,type})})));S.near={sub:sub.items.filter(x=>S.admin[x.id]?.status!=="not"),food:food.items.filter(x=>S.admin[x.id]?.status!=="not"),cafe:cafe.items.filter(x=>S.admin[x.id]?.status!=="not")};renderAround()}catch(e){err(e.message)}}
function mini(p,type){const on=S.pick[type]?.id===p.id;return `<div class="card place ${on?"choice":""}"><h3>${esc(p.name)}</h3><div class="meta">🚗 메인에서 약 ${p.route_minutes}분 · ${esc(p.category)}<br>${esc(p.road_address||p.address||"")}</div>${adminTag(p)}<div id="nv_${p.id}"><div class="hint">네이버 사진·후기 검색결과 불러오는 중…</div></div><div class="actions"><button class="naverbtn" onclick="openNaver('${esc(p.name)}')">네이버 보기</button><button class="select" onclick="pickNear('${type}','${p.id}')">${on?"선택됨":"선택"}</button></div></div>`}
function renderAround(){main.innerHTML=`<button class="back" onclick="${S.period==="종일"?"secondMain()":"listMain()"}">← 메인 다시 고르기</button><div class="section">선택한 메인</div>${baseCard(S.main1,false)}${S.main2?`<div class="section">두 번째 메인</div>${baseCard(S.main2,false)}`:""}<div class="section">보조 콘텐츠</div>${S.near.sub.slice(0,5).map(x=>mini(x,"sub")).join("")||'<div class="card hint">적당한 보조 콘텐츠가 없습니다.</div>'}<div class="section">🍚 근처 식당</div>${S.near.food.slice(0,5).map(x=>mini(x,"food")).join("")}<div class="section">☕ 근처 카페</div>${S.near.cafe.slice(0,5).map(x=>mini(x,"cafe")).join("")}<button class="primary" onclick="final()">선택한 내용으로 일정 보기</button>`;[S.main1,S.main2,...S.near.sub.slice(0,5),...S.near.food.slice(0,5),...S.near.cafe.slice(0,5)].filter(Boolean).forEach(enrich)}
function pickNear(type,id){const p=S.near[type].find(x=>x.id===id);S.pick[type]=S.pick[type]?.id===id?null:p;renderAround()}
function final(){const xs=[S.main1,S.pick.sub,S.pick.food,S.pick.cafe,S.main2].filter(Boolean);main.innerHTML=`<button class="back" onclick="renderAround()">← 다시 고르기</button><div class="section">오늘 일정</div>${xs.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.name)}</b><div class="meta">이동 약 ${x.route_minutes}분</div></div>`).join("")}<button class="primary" onclick="saveNow()">이 일정 찜하기</button>`}
function saveNow(){S.saved.unshift([S.main1,S.pick.sub,S.pick.food,S.pick.cafe,S.main2].filter(Boolean).map(x=>({id:x.id,name:x.name})));S.saved=S.saved.slice(0,20);LS.s("lt_saved",S.saved);alert("저장했습니다.")}
function saved(){navSet("saved");main.innerHTML=`<div class="section">찜목록</div>${S.saved.length?S.saved.map(x=>`<div class="card">${x.map(y=>esc(y.name)).join(" → ")}</div>`).join(""):'<div class="card hint">아직 없습니다.</div>'}`}
async function saveHome(){try{const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(x=>ok({x:x.coords.longitude,y:x.coords.latitude}),()=>no(Error("위치 권한 필요"))));S.home=p;LS.s("lt_home",p);admin()}catch(e){alert(e.message)}}
function setAdmin(id,status){S.admin[id]={...(S.admin[id]||{}),status};LS.s("lt_admin",S.admin);admin()}
function saveAdmin(id){S.admin[id]={...(S.admin[id]||{}),note:document.getElementById("note_"+id).value,hours:document.getElementById("hours_"+id).value};LS.s("lt_admin",S.admin);admin()}
function admin(){navSet("admin");const seen=[...S.candidates,...S.near.sub,...S.near.food,...S.near.cafe];const map=new Map();seen.forEach(x=>x?.id&&!map.has(x.id)&&map.set(x.id,x));main.innerHTML=`<div class="section">관리</div><div class="card"><b>우리집</b><div class="hint">${S.home?"위치 저장됨":"미등록"}</div><button class="ghost" style="width:100%;margin-top:7px" onclick="saveHome()">📍 현재 위치를 우리집으로 저장</button></div><div class="section">최근 본 장소</div>${[...map.values()].map(x=>{const a=S.admin[x.id]||{};return `<div class="card admin"><b>${esc(x.name)}</b><div class="adminrow"><button class="rec" onclick="setAdmin('${x.id}','rec')">⭐ 추천</button><button class="not" onclick="setAdmin('${x.id}','not')">❌ 비추천</button><button onclick="setAdmin('${x.id}','')">보류</button></div><textarea id="note_${x.id}" placeholder="관리자 멘트">${esc(a.note||"")}</textarea><input class="input" id="hours_${x.id}" placeholder="운영시간/휴무 직접 확인값 예: 월 휴무, 화~일 10:00~20:00" value="${esc(a.hours||"")}"><button class="ghost" style="width:100%;margin-top:7px" onclick="saveAdmin('${x.id}')">저장</button></div>`}).join("")||'<div class="card hint">추천을 먼저 실행해 주세요.</div>'}`}
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>n.dataset.page==="home"?home():n.dataset.page==="saved"?saved():admin());
api("/api/app?mode=health").then(d=>{if(!d.kakao||!d.naver)err("API 키가 아직 Vercel 환경변수에 설정되지 않았습니다. KAKAO_REST_KEY, NAVER_API_KEY_ID, NAVER_API_KEY_SECRET가 필요합니다.");else home()}).catch(()=>home());
</script></body></html>
