<html lang="ko">
<head>

<style>

*{box-sizing:border-box}body{margin:0;background:#eee9e3;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:76px}.top{padding:24px 19px 12px}.brand{font-size:25px;font-weight:900}.sub{margin-top:5px;color:var(--muted);font-size:13px}
main{padding:0 17px 26px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;margin:11px 0}.label{font-size:13px;font-weight:800;color:#6f6962;margin:15px 0 8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:0;background:var(--soft);border-radius:12px;padding:10px 13px;color:#655f58}.chip.on{background:var(--ink);color:white;font-weight:800}.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}.row{display:flex;gap:8px}.row>*{flex:1}.primary{width:100%;border:0;background:var(--ink);color:#fff;border-radius:15px;padding:15px;font-weight:900;font-size:16px}.ghost{border:0;background:var(--soft);border-radius:12px;padding:11px;font-weight:700}.section{font-size:20px;font-weight:900;margin:20px 2px 8px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.place h3{margin:0 0 7px;font-size:17px}.place .photo-row{margin-top:9px}.meta{font-size:12px;color:var(--muted);line-height:1.65}.stars{font-size:12px;color:#c87922;font-weight:900}.tags{margin-top:5px}.tag{display:inline-block;background:var(--soft);border-radius:7px;padding:4px 7px;font-size:10px;margin:2px 3px 0 0}.admin-rec{background:var(--good)}.admin-not{background:var(--bad)}.actions{display:flex;gap:7px;margin-top:11px}.actions button{flex:1}.reserve{border:0;background:#1c64d1;color:white;border-radius:12px;padding:11px;font-weight:800}.refresh{width:100%;border:1px dashed #cfc5ba;background:#fff;border-radius:14px;padding:13px;font-weight:800;margin:10px 0 2px}.back{border:0;background:none;color:#6d675f;padding:6px 0}.choice{border:2px solid var(--ink)}.small-card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}.small-card h4{margin:0 0 5px}
.photo-row{display:grid;grid-template-columns:1.35fr 1fr;gap:7px;margin:10px 0}
.photo{height:112px;border-radius:13px;overflow:hidden;position:relative;background:linear-gradient(135deg,#eee5da,#d8e5dc);display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:900;text-shadow:0 1px 4px #0008}
.photo.small{height:112px;background:linear-gradient(135deg,#dfe8ef,#eadfd8)}
.photo:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,#0007)}
.photo span{position:relative;z-index:1;font-size:12px}
.bizline{margin-top:7px;padding:8px 10px;background:#faf7f2;border-radius:9px;font-size:11px;color:#645f59;line-height:1.5}
.bizline.closed{background:#fff0ef;color:#9a3b32;font-weight:800}
.mini-reviews{margin-top:9px}
.mini-reviews div{font-size:11px;color:#706a63;line-height:1.45;padding:4px 0;border-bottom:1px solid #eee7df}
.mini-reviews div:last-child{border-bottom:0}
.review-title{font-size:11px;font-weight:900;color:#4f4a45;margin-bottom:2px}
.selectbtn{margin-top:8px;width:100%;border:0;background:var(--soft);border-radius:10px;padding:9px;font-weight:800}.selectbtn.on{background:var(--ink);color:white}.summary{background:#f4efe7;border-radius:16px;padding:14px;line-height:1.6;font-size:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:66px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}.nav{flex:1;border:0;background:#fff;color:#8b857d;font-size:11px}.nav.on{color:#252421;font-weight:900}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0005;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);max-height:80vh;overflow:auto;background:white;border-radius:23px 23px 0 0;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:20px}.reviewitem{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.55}.review-preview{margin-top:10px;background:#faf7f2;border-radius:12px;padding:10px}.review-preview div{font-size:11px;line-height:1.45;color:#6f6962;padding:5px 0;border-bottom:1px solid #eee6dc}.review-preview div:last-child{border-bottom:0}.admin-controls{display:flex;gap:7px;margin-top:10px}.admin-controls button{flex:1;border:0;border-radius:10px;padding:10px}.notearea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:11px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">아이랑 어디갈까?</div><div class="sub">오늘 애기랑 뭐하지? 가까운 곳부터 골라보세요.</div></div>

<script>
const pool=[
{id:1,name:"광주 어린이박물관",drive:18,stay:80,age:"3~6세",indoor:true,rating:4.7,reviews:1284,reserve:true,kind:"전시·체험",open:"10:00",close:"18:00",closedDays:[1],subs:["어린이 놀이터","도서관 어린이자료실","짧은 산책코스"],foods:["가족식당 A","한식당 B","돈가스집 C"],cafes:["넓은 베이커리카페","정원카페","유아의자 있는 카페"]},
{id:2,name:"빛고을 키즈체험관",drive:24,stay:110,age:"3~7세",indoor:true,rating:4.8,reviews:632,reserve:true,kind:"체험",open:"10:00",close:"18:00",closedDays:[1],subs:["작은 공원","만들기 체험","어린이 서점"],foods:["아이밥상","주차편한 식당","가족 중식당"],cafes:["키즈존 카페","대형 카페","베이커리카페"]},
{id:3,name:"담양 동물체험농장",drive:36,stay:120,age:"2~7세",indoor:false,rating:4.6,reviews:913,reserve:true,kind:"동물",open:"09:30",close:"18:00",closedDays:[1],subs:["메타세쿼이아 산책","작은 놀이터","연못 산책"],foods:["담양 가족식당","국수집","떡갈비집"],cafes:["정원카페","대형카페","한옥카페"]},
{id:4,name:"나주 어린이과학체험관",drive:32,stay:95,age:"4~8세",indoor:true,rating:4.7,reviews:744,reserve:false,kind:"과학",open:"10:00",close:"18:00",closedDays:[1],subs:["도서관","잔디공원","미니놀이터"],foods:["나주 가족식당","곰탕집","돈가스집"],cafes:["혁신도시 카페","베이커리카페","테라스카페"]},
{id:5,name:"화순 숲체험원",drive:39,stay:100,age:"3~8세",indoor:false,rating:4.8,reviews:1015,reserve:true,kind:"자연",open:"09:00",close:"18:00",closedDays:[1],subs:["숲 놀이터","생태관찰로","작은 전시관"],foods:["화순 한식당","아이와 가기 좋은 식당","국수집"],cafes:["숲카페","대형카페","베이커리카페"]},
{id:6,name:"장성 어린이공방",drive:41,stay:90,age:"4~8세",indoor:true,rating:4.8,reviews:518,reserve:true,kind:"공예",open:"10:00",close:"18:00",closedDays:[1],subs:["황룡강 산책","작은 놀이터","도서관"],foods:["장성 가족식당","한식당","브런치식당"],cafes:["강변카페","베이커리카페","정원카페"]},
{id:7,name:"순천만 어린이생태관",drive:58,stay:120,age:"3~8세",indoor:true,rating:4.7,reviews:1402,reserve:false,kind:"생태",open:"10:00",close:"18:00",closedDays:[1],subs:["정원 산책","어린이놀이터","짧은 전시"],foods:["순천 가족식당","국밥집","돈가스집"],cafes:["정원카페","대형카페","키즈존카페"]},
{id:8,name:"곡성 기차마을 어린이체험",drive:61,stay:150,age:"3~8세",indoor:false,rating:4.6,reviews:1890,reserve:true,kind:"놀이",open:"09:00",close:"18:00",closedDays:[1],subs:["장미공원","미니동물원","기차전시"],foods:["곡성 가족식당","한식당","국수집"],cafes:["기차마을 카페","베이커리카페","강변카페"]},
{id:9,name:"정읍 어린이기적의도서관",drive:66,stay:80,age:"2~8세",indoor:true,rating:4.7,reviews:504,reserve:false,kind:"책·문화",open:"10:00",close:"18:00",closedDays:[1],subs:["공원","어린이놀이터","미술전시"],foods:["정읍 가족식당","한식당","파스타집"],cafes:["대형카페","베이커리카페","키즈카페"]},
{id:10,name:"남원 어린이체험센터",drive:69,stay:120,age:"3~8세",indoor:true,rating:4.8,reviews:620,reserve:true,kind:"체험",open:"10:00",close:"18:00",closedDays:[1],subs:["광한루 산책","작은공원","전통놀이"],foods:["남원 가족식당","추어탕집","돈가스집"],cafes:["한옥카페","베이커리카페","정원카페"]},
{id:11,name:"하동 차문화 어린이체험",drive:72,stay:95,age:"4~8세",indoor:true,rating:4.6,reviews:412,reserve:true,kind:"문화",open:"10:00",close:"18:00",closedDays:[1],subs:["차밭 산책","작은 박물관","전망대"],foods:["하동 가족식당","한식당","국수집"],cafes:["차밭카페","한옥카페","베이커리카페"]},
{id:12,name:"사천 항공 어린이체험관",drive:74,stay:130,age:"4~9세",indoor:true,rating:4.8,reviews:973,reserve:true,kind:"항공",open:"10:00",close:"18:00",closedDays:[1],subs:["항공공원","전시관","놀이터"],foods:["사천 가족식당","해물식당","돈가스집"],cafes:["바다카페","대형카페","베이커리카페"]}
];

let state={
 date:"오늘",age:"3~4세",period:"오전",nap:"필요",drive:30,origin:"우리집",originText:"",
 page:0,main1:null,main2:null,sub:null,food:null,cafe:null,
 saved:JSON.parse(localStorage.getItem("littletripSaved")||"[]"),
 admin:JSON.parse(localStorage.getItem("littletripAdmin")||"{}")
};

function saveLocal(){localStorage.setItem("littletripSaved",JSON.stringify(state.saved));localStorage.setItem("littletripAdmin",JSON.stringify(state.admin))}
function setNav(page){document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.page===page))}
function setOption(k,v){state[k]=v;renderHome()}
function renderHome(){
 setNav("home");
 main.innerHTML=`<div class="card">
   <div class="label">📍 어디에서 출발할까요?</div>
   <div class="chips">
    ${["우리집","현재 위치","직접 입력"].map(x=>`<button class="chip ${state.origin===x?"on":""}" onclick="setOrigin('${x}')">${x}</button>`).join("")}
   </div>
   ${state.origin==="직접 입력"?`<input class="input" placeholder="출발지 주소 또는 장소" value="${state.originText}" oninput="state.originText=this.value">`:""}
   <div class="label">📅 언제?</div><div class="chips">${["오늘","내일","주말"].map(x=>`<button class="chip ${state.date===x?"on":""}" onclick="setOption('date','${x}')">${x}</button>`).join("")}</div>
   <div class="label">👶 아이 나이</div><div class="chips">${["1~2세","3~4세","5~6세","7세+"].map(x=>`<button class="chip ${state.age===x?"on":""}" onclick="setOption('age','${x}')">${x}</button>`).join("")}</div>
   <div class="label">🕐 일정</div><div class="chips">${["오전","오후","종일"].map(x=>`<button class="chip ${state.period===x?"on":""}" onclick="setOption('period','${x}')">${x}</button>`).join("")}</div>
   <div class="label">😴 낮잠</div><div class="chips">${["필요","필요 없음"].map(x=>`<button class="chip ${state.nap===x?"on":""}" onclick="setOption('nap','${x}')">${x}</button>`).join("")}</div>
   <div class="label">🚗 집에서 메인 콘텐츠까지</div><div class="chips"><button class="chip ${state.drive===30?"on":""}" onclick="setOption('drive',30)">약 30분</button><button class="chip ${state.drive===60?"on":""}" onclick="setOption('drive',60)">약 1시간</button></div>
   <div class="hint">'약 30분'은 약 40분까지, '약 1시간'은 약 1시간 15분까지 후보를 보여줍니다.</div>
   <button class="primary" style="margin-top:16px" onclick="showMainRecommendations()">메인 콘텐츠 추천받기</button>
 </div>`;
}
function setOrigin(x){
 state.origin=x;
 if(x==="현재 위치"){
   if(navigator.geolocation) navigator.geolocation.getCurrentPosition(()=>{},()=>{});
 }
 renderHome();
}

function getCandidates(){
 const max=state.drive===30?40:75;
 return pool.filter(p=>p.drive<=max);
}
function pageSlice(list){
 const start=(state.page*6)%Math.max(list.length,1);
 const out=[];
 for(let i=0;i<Math.min(6,list.length);i++) out.push(list[(start+i)%list.length]);
 return out;
}
function showMainRecommendations(){
 setNav("home");
 const list=getCandidates();
 const six=pageSlice(list);
 main.innerHTML=`<button class="back" onclick="renderHome()">← 조건 다시 선택</button>
 <div class="section">오늘 갈 메인 콘텐츠</div>
 <div class="hint">먼저 한 곳을 고르세요. 그다음 이 장소를 기준으로 보조 콘텐츠·식당·카페를 보여드립니다.</div>
 ${six.map(placeCard).join("")}
 <button class="refresh" onclick="refreshSix()">🔄 마음에 드는 곳이 없어요 · 다른 6곳 추천</button>`;
}
function refreshSix(){state.page++;showMainRecommendations()}

function dayIndexForSelection(){
 const now=new Date();
 if(state.date==="오늘") return now.getDay();
 if(state.date==="내일"){ const d=new Date(now); d.setDate(d.getDate()+1); return d.getDay(); }
 if(state.date==="주말"){
   const d=new Date(now);
   let add=(6-d.getDay()+7)%7; if(add===0 && d.getHours()>12) add=7;
   d.setDate(d.getDate()+add); return d.getDay();
 }
 return now.getDay();
}
function dayName(i){return ["일","월","화","수","목","금","토"][i]}
function visualLabel(name, kind){
 const icon = kind.includes("카페")?"☕":kind.includes("식당")||kind.includes("음식")?"🍽️":kind.includes("동물")?"🐑":kind.includes("자연")?"🌿":kind.includes("책")?"📚":kind.includes("과학")?"🧪":kind.includes("공예")?"🎨":"🧸";
 return `<div class="photo-row"><div class="photo"><span>${icon} ${name}</span></div><div class="photo small"><span>대표 이미지 2</span></div></div>`;
}
function scheduleInfo(item){
 const day=dayIndexForSelection();
 const closed=(item.closedDays||[]).includes(day);
 if(closed) return {closed:true,text:`${dayName(day)}요일 휴무`};
 return {closed:false,text:`영업 ${item.open||"10:00"} ~ ${item.close||"18:00"}${item.lastOrder?` · 라스트오더 ${item.lastOrder}`:""}`};
}
function secondaryReviews(name,type){
 const base = type==="cafe" ? [
  `“${name} 공간이 넓고 아이와 앉기 편했어요.”`,
  `“주차가 편하고 음료 기다리는 시간도 길지 않았어요.”`,
  `“유아 동반 손님이 꽤 많았어요.”`
 ] : type==="food" ? [
  `“${name} 아이와 함께 먹기 무난했어요.”`,
  `“아기의자나 가족석 이용이 편했어요.”`,
  `“주차 후 입장 동선이 편했습니다.”`
 ] : [
  `“${name} 메인 일정 뒤에 잠깐 들르기 좋았어요.”`,
  `“30~50분 정도 짧게 즐기기 괜찮았어요.”`,
  `“아이 컨디션에 따라 가볍게 추가하기 좋아요.”`
 ];
 return base;
}

function sampleReviews(p){
 const base=[
  `“${p.name} 아이와 가기 괜찮았어요.”`,
  `“${p.age} 정도 아이가 즐기기 좋았습니다.”`,
  `“예상 체류시간은 ${Math.max(40,p.stay-20)}~${p.stay}분 정도였어요.”`,
  p.indoor?`“실내라 날씨 영향 없이 이용하기 편했어요.”`:`“야외라 아이가 뛰어놀기 좋았어요.”`,
  `“주말에는 조금 일찍 가는 편이 좋습니다.”`
 ];
 return base.slice(0,4);
}
function placeCard(p){
 const a=state.admin[p.id]||{};
 return `<div class="card place ${a.status==="rec"?"admin-rec":a.status==="not"?"admin-not":""}">
  <h3>${p.name}</h3>
  ${visualLabel(p.name,p.kind)}
  <div class="stars">★ ${p.rating} <span class="meta">· 리뷰 ${p.reviews.toLocaleString()}개</span></div>
  <div class="meta">🚗 약 ${p.drive}분 · ⏱ 예상 체류 ${p.stay}분 · ${p.indoor?"실내":"야외"} · ${p.age}</div>
  <div class="bizline">${scheduleInfo(p).text}</div>
  <div class="tags"><span class="tag">${p.kind}</span>${p.reserve?'<span class="tag">예약 가능</span>':''}${a.status?`<span class="tag">관리자 ${a.status==="rec"?"추천":"비추천"}</span>`:""}</div>
  ${a.note?`<div class="hint" style="margin-top:8px"><b>관리자 멘트</b> · ${a.note}</div>`:""}
  <div class="review-preview">${sampleReviews(p).map(r=>`<div>${r}</div>`).join("")}</div>
  <button class="primary" style="margin-top:10px" onclick="chooseMain(${p.id})">선택</button>
 </div>`;
}
function chooseMain(id){
 state.main1=pool.find(p=>p.id===id);state.main2=null;state.sub=null;state.food=null;state.cafe=null;
 if(state.period==="종일") chooseSecondMain();
 else renderAfterMain();
}
function chooseSecondMain(){
 const p=state.main1;
 const alternatives=getCandidates().filter(x=>x.id!==p.id).slice(0,6);
 main.innerHTML=`<button class="back" onclick="showMainRecommendations()">← 첫 메인 다시 고르기</button>
 <div class="section">종일 일정이라 메인 콘텐츠를 하나 더 골라주세요</div>
 <div class="summary"><b>오전 메인</b><br>${p.name} · 예상 ${p.stay}분</div>
 ${alternatives.map(x=>`<div class="small-card"><h4>${x.name}</h4><div class="meta">🚗 약 ${x.drive}분 · ⏱ ${x.stay}분 · ${x.kind}</div><button class="selectbtn" onclick="chooseMain2(${x.id})">오후 메인으로 선택</button></div>`).join("")}`;
}
function chooseMain2(id){state.main2=pool.find(p=>p.id===id);renderAfterMain()}
function renderAfterMain(){
 const p=state.main1;
 main.innerHTML=`<button class="back" onclick="${state.period==="종일"?"chooseSecondMain()":"showMainRecommendations()"}">← 메인 콘텐츠 다시 고르기</button>
 <div class="section">선택한 메인 콘텐츠</div>
 <div class="card choice"><h3>${p.name}</h3><div class="meta">🚗 약 ${p.drive}분 · ⏱ 예상 ${p.stay}분</div>${p.reserve?'<button class="reserve" style="width:100%;margin-top:10px" onclick="reserve(\''+p.name+'\')">네이버 예약 연결</button>':""}</div>
 ${state.main2?`<div class="card choice"><h3>${state.main2.name}</h3><div class="meta">종일 일정 두 번째 메인 · ⏱ ${state.main2.stay}분</div>${state.main2.reserve?'<button class="reserve" style="width:100%;margin-top:10px" onclick="reserve(\''+state.main2.name+'\')">네이버 예약 연결</button>':""}</div>`:""}
 <div class="section">보조 콘텐츠</div>
 <div class="hint">메인 콘텐츠가 짧거나 시간이 남을 때만 추가하세요.</div>
 ${p.subs.map((x,i)=>smallOption("sub",x,`${3+i*3}분 거리 · 약 ${30+i*10}분`)).join("")}
 <div class="section">🍚 근처 식당</div>
 ${p.foods.map((x,i)=>smallOption("food",x,`${5+i*2}분 거리 · 아이 동반 추천`,i===0)).join("")}
 <div class="section">☕ 근처 카페</div>
 ${p.cafes.map((x,i)=>smallOption("cafe",x,`${4+i*3}분 거리 · 유아 동반`,i===1)).join("")}
 <button class="primary" style="margin-top:16px" onclick="showFinal()">선택한 내용으로 일정 보기</button>`;
}
function smallOption(type,name,meta,reservable=false){
 const on=state[type]===name;
 const ix = type==="sub" ? (state.main1?.subs||[]).indexOf(name) : type==="food" ? (state.main1?.foods||[]).indexOf(name) : (state.main1?.cafes||[]).indexOf(name);
 const defaults = type==="cafe"
   ? [{open:"09:30",close:"21:30",closedDays:[1]},{open:"10:00",close:"22:00",closedDays:[2]},{open:"09:00",close:"20:30",closedDays:[]}]
   : type==="food"
   ? [{open:"11:00",close:"20:30",closedDays:[1],lastOrder:"19:45"},{open:"10:30",close:"21:00",closedDays:[]},{open:"11:00",close:"20:00",closedDays:[2]}]
   : [{open:"09:00",close:"18:00",closedDays:[1]},{open:"10:00",close:"19:00",closedDays:[]},{open:"09:30",close:"17:30",closedDays:[2]}];
 const biz = defaults[(ix<0?0:ix)%defaults.length];
 const s = scheduleInfo(biz);
 const reviews=secondaryReviews(name,type);
 const title = type==="cafe"?"카페":type==="food"?"식당":"보조 콘텐츠";
 return `<div class="small-card">
   <h4>${name}</h4>
   ${visualLabel(name,title)}
   <div class="meta">${meta}</div>
   <div class="bizline ${s.closed?"closed":""}">${s.closed?"⛔ ":"🕐 "}${s.text}</div>
   <div class="mini-reviews"><div class="review-title">최근 후기 미리보기</div>${reviews.map(r=>`<div>${r}</div>`).join("")}</div>
   <div class="actions">
     <button class="selectbtn ${on?"on":""}" ${s.closed?"disabled style='opacity:.45'":""} onclick="${s.closed?"":`pick('${type}','${name}')`}">${s.closed?"휴무":"선택"}</button>
     ${reservable && !s.closed?`<button class="reserve" onclick="reserve('${name}')">네이버 예약</button>`:""}
   </div>
 </div>`;
}
function pick(type,name){state[type]=state[type]===name?null:name;renderAfterMain()}
function showFinal(){
 const parts=[state.main1?.name,state.sub,state.food,state.cafe,state.main2?.name].filter(Boolean);
 main.innerHTML=`<button class="back" onclick="renderAfterMain()">← 구성 다시 고르기</button>
 <div class="section">오늘 일정</div>
 <div class="summary">${parts.map((x,i)=>`${i+1}. ${x}`).join("<br>")}</div>
 <div class="hint" style="margin:10px 2px">실제 API 연결 후에는 각 장소의 영업시간·예약 가능 여부·실제 이동시간을 다시 검증해 최종 시간표를 계산합니다.</div>
 <button class="primary" onclick="saveCurrent()">이 일정 찜하기</button>`;
}
function saveCurrent(){
 const label=[state.main1?.name,state.sub,state.food,state.cafe,state.main2?.name].filter(Boolean).join(" → ");
 state.saved.unshift(label);state.saved=[...new Set(state.saved)];saveLocal();alert("찜목록에 저장했습니다.");
}
function reserve(name){alert(name+"의 실제 네이버 예약 URL이 연결되면 이 버튼으로 바로 이동합니다.")}
function openReviews(id){
 const p=pool.find(x=>x.id===id);
 modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h3>${p.name}</h3><button class="close" onclick="closeModal()">×</button></div><div class="stars">★ ${p.rating} · 리뷰 ${p.reviews.toLocaleString()}개</div><div class="reviewitem">아이와 방문하기 좋았다는 후기 예시입니다.</div><div class="reviewitem">실제 서비스에서는 사용권한이 확보된 리뷰 데이터만 표시합니다.</div></div></div>`;
 modal.classList.remove("hidden");
}
function closeModal(){modal.classList.add("hidden");modal.innerHTML=""}
function showSaved(){
 setNav("saved");
 main.innerHTML=`<div class="section">찜목록</div>${state.saved.length?state.saved.map(x=>`<div class="card">${x}</div>`).join(""):'<div class="card hint">아직 찜한 일정이 없습니다.</div>'}`;
}
function showAdmin(){
 setNav("admin");
 main.innerHTML=`<div class="section">관리자 장소 관리</div><div class="hint">직접 다녀온 장소는 추천/비추천과 멘트를 남겨 추천에 반영하세요.</div>
 ${pool.map(p=>{const a=state.admin[p.id]||{};return `<div class="card"><h3>${p.name}</h3>
 <div class="admin-controls"><button class="admin-rec" onclick="setAdmin(${p.id},'rec')">⭐ 추천</button><button class="admin-not" onclick="setAdmin(${p.id},'not')">❌ 비추천</button><button onclick="setAdmin(${p.id},'')">보류</button></div>
 <textarea class="notearea" id="note${p.id}" placeholder="직접 방문 멘트">${a.note||""}</textarea>
 <button class="ghost" style="width:100%;margin-top:7px" onclick="saveNote(${p.id})">멘트 저장</button></div>`}).join("")}`;
}
function setAdmin(id,status){state.admin[id]={...(state.admin[id]||{}),status};saveLocal();showAdmin()}
function saveNote(id){state.admin[id]={...(state.admin[id]||{}),note:document.getElementById("note"+id).value};saveLocal();showAdmin()}

document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{if(n.dataset.page==="home")renderHome();if(n.dataset.page==="saved")showSaved();if(n.dataset.page==="admin")showAdmin()});
renderHome();
</script>
</body>
</html>
