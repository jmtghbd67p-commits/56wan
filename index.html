/* 카카오 REST 키는 서버의 길찾기에만 쓰고, 지도 표시는 별도의 공개 JavaScript 키로
   공식 SDK를 로드한다. 검색 후보는 계속 네이버 API만 사용한다. */
const KAKAO_MAP_APP_KEY='11436f9490478158ad0cc21a7f9ce826';
let kakaoMapSdkPromise=null;
let kakaoPickerMap=null;
let kakaoPickerMarker=null;

function loadKakaoMapSdk(){
  if(window.kakao?.maps)return Promise.resolve(window.kakao.maps);
  if(kakaoMapSdkPromise)return kakaoMapSdkPromise;
  kakaoMapSdkPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.async=true;
    script.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_MAP_APP_KEY)}&autoload=false`;
    script.onload=()=>{
      if(!window.kakao?.maps?.load){reject(Error('카카오 지도 SDK를 초기화하지 못했습니다.'));return}
      window.kakao.maps.load(()=>resolve(window.kakao.maps));
    };
    script.onerror=()=>reject(Error('카카오 지도를 불러오지 못했습니다. 플랫폼 도메인을 확인해 주세요.'));
    document.head.appendChild(script);
  }).catch(error=>{kakaoMapSdkPromise=null;throw error});
  return kakaoMapSdkPromise;
}

function kakaoPickerMarkerImage(){
  const pin='<svg xmlns="http://www.w3.org/2000/svg" width="44" height="56" viewBox="0 0 44 56"><path d="M22 2C11 2 3 10.4 3 21.2c0 14.2 19 31.3 19 31.3s19-17.1 19-31.3C41 10.4 33 2 22 2z" fill="#1769e0" stroke="#fff" stroke-width="4"/><circle cx="22" cy="21" r="6" fill="#fff"/></svg>';
  return new kakao.maps.MarkerImage(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(pin)}`,new kakao.maps.Size(44,56),{offset:new kakao.maps.Point(22,54)});
}

function renderKakaoMapError(message){
  const status=document.getElementById('kakao-navigation-map-status');
  const confirm=document.getElementById('kakao-navigation-map-confirm');
  if(status)status.textContent=message;
  if(confirm)confirm.disabled=true;
}

function selectKakaoMapPoint(position){
  const point={x:+position.getLng().toFixed(6),y:+position.getLat().toFixed(6)};
  S.mapPick=point;
  if(kakaoPickerMarker)kakaoPickerMarker.setPosition(position);
  else{
    kakaoPickerMarker=new kakao.maps.Marker({position,image:kakaoPickerMarkerImage(),zIndex:3});
    kakaoPickerMarker.setMap(kakaoPickerMap);
  }
  const status=document.getElementById('kakao-navigation-map-status');
  const confirm=document.getElementById('kakao-navigation-map-confirm');
  if(status)status.textContent='선택한 위치를 출발지로 사용합니다.';
  if(confirm)confirm.disabled=false;
}

function initKakaoNavigationMap(){
  const container=document.getElementById('kakao-navigation-map');
  if(!container)return;
  const selected=S.mapPick||S.home;
  const center=selected?new kakao.maps.LatLng(selected.y,selected.x):new kakao.maps.LatLng(35.9078,127.7669);
  kakaoPickerMap=new kakao.maps.Map(container,{center,level:selected?4:12});
  kakaoPickerMarker=null;
  if(selected)selectKakaoMapPoint(center);
  kakao.maps.event.addListener(kakaoPickerMap,'click',event=>selectKakaoMapPoint(event.latLng));
}

function openKakaoNavigationMap(){
  modal.innerHTML=`<div class="modal map-modal kakao-navigation-map-modal"><section class="kakao-navigation-map-sheet"><div class="kakao-navigation-map-top"><button class="kakao-navigation-map-button" aria-label="지도 닫기" onclick="closeMap()">${icon('x')}</button><div class="kakao-navigation-map-title"><b>출발지를 지도에서 선택</b><span>원하는 위치를 한 번 누르세요.</span></div><button class="kakao-navigation-map-button" aria-label="현재 위치로 이동" onclick="focusKakaoNavigationMap()">${icon('locate-fixed')}</button></div><div id="kakao-navigation-map" class="kakao-navigation-map-canvas"></div><div class="kakao-navigation-map-credit">Kakao Map</div><div class="kakao-navigation-map-bottom"><div id="kakao-navigation-map-status" class="kakao-navigation-map-status">한글 지도를 불러오는 중입니다.</div><button id="kakao-navigation-map-confirm" class="primary" disabled onclick="confirmMapPick()">이 위치를 출발지로 ${icon('arrow-right')}</button></div></section></div>`;
  paintIcons();
  loadKakaoMapSdk().then(initKakaoNavigationMap).catch(error=>renderKakaoMapError(error.message));
}

function focusKakaoNavigationMap(){
  if(!kakaoPickerMap||!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(position=>{
    const current=new kakao.maps.LatLng(position.coords.latitude,position.coords.longitude);
    kakaoPickerMap.setLevel(4);
    kakaoPickerMap.panTo(current);
    selectKakaoMapPoint(current);
  },()=>renderKakaoMapError('현재 위치를 가져오지 못했습니다. 지도를 눌러 선택해 주세요.'),{enableHighAccuracy:true,timeout:8000});
}

const closeKakaoMap=closeMap;
closeMap=()=>{kakaoPickerMap=null;kakaoPickerMarker=null;closeKakaoMap()};
openMap=()=>{if(!blockHomeMapOpen)openKakaoNavigationMap()};

function localYmd(date=new Date()){
  const offset=date.getTimezoneOffset();
  return new Date(date.getTime()-offset*60000).toISOString().slice(0,10);
}

function normalizeCultureDate(){
  const now=new Date(),today=localYmd(now),monthPrefix=today.slice(0,7);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(S.cultureDate||'')||!S.cultureDate.startsWith(monthPrefix)||S.cultureDate<today)S.cultureDate=today;
}

function cultureCalendar(){
  normalizeCultureDate();
  const now=new Date(),year=now.getFullYear(),month=now.getMonth(),today=localYmd(now);
  const firstDay=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();
  const blanks=Array.from({length:firstDay},()=>'<span class="culture-calendar-blank"></span>').join('');
  const dates=Array.from({length:days},(_,index)=>{
    const day=index+1,date=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const disabled=date<today;
    return `<button class="culture-calendar-day ${S.cultureDate===date?'on':''}" ${disabled?'disabled':''} onclick="${disabled?'':`chooseCultureDate('${date}')`}">${day}</button>`;
  }).join('');
  return `<div class="culture-calendar"><div class="culture-calendar-title">${year}년 ${month+1}월</div><div class="culture-calendar-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="culture-calendar-grid">${blanks}${dates}</div></div>`;
}

function chooseCultureDate(date){S.cultureDate=date;S.items=[];home();}

function conceptCard(key){
  const [glyph,title,description]=ALL_THEMES[key];
  const selected=S.themes.includes(key);
  return `<button class="concept-card ${selected?'on':''}" aria-pressed="${selected}" onclick="chooseTheme('${key}')"><span class="concept-title-row"><span class="concept-icon">${icon(glyph)}</span><b>${esc(title)}</b></span><small>${esc(description)}</small></button>`;
}

function chooseTheme(key){
  S.themes=S.themes.includes(key)?S.themes.filter(selected=>selected!==key):[...S.themes,key];
  S.theme=S.themes[0]||null;
  if(S.themes.includes('culture'))normalizeCultureDate();
  S.items=[];
  home();
}

function objectParticle(word){
  const last=[...String(word||'')].at(-1)||'';
  const code=last.charCodeAt(0)-0xAC00;
  return code>=0&&code<11172&&code%28?'을':'를';
}

home=()=>{
  normalizeSchedule();
  navSet('home');
  const dates=dateOptions(),availability=todayAvailability();
  const selectedNames=S.themes.map(key=>ALL_THEMES[key]?.[1]).filter(Boolean);
  render(`<div class="card">${field('map-pin','출발지',`<div class="chips">${['현재 위치','지도에서 선택','직접 입력'].map(value=>chip('origin',value)).join('')}</div>${S.origin==='지도에서 선택'?`<div class="hint" style="margin-top:8px">${S.mapPick?'선택한 위치를 출발지로 사용합니다.':'지도를 열어 출발할 곳을 선택해 주세요.'}</div>${S.mapPick?`<button class="soft-btn" style="margin-top:9px" onclick="openMap()">${icon('map')} 지도에서 다시 고르기</button>`:''}`:''}${S.origin==='직접 입력'?`<input class="input" style="margin-top:9px" value="${esc(S.originText)}" placeholder="전국 도로명주소 또는 장소명" oninput="S.originText=this.value;S.originPos=null">`:''}`)}${field('calendar-days','언제?',`<div class="chips">${dates.map(date=>chip('date',date.key,date.label)).join('')}</div>${!availability.today?`<div class="hint" style="margin-top:7px">오늘 나들이 시간은 지나 내일부터 추천합니다.</div>`:''}`)}${field('clock-3','일정',`<div class="chips">${['오전','오후','종일'].map(value=>chip('period',value,value,periodDisabled(value))).join('')}</div>${S.date==='today'&&(!availability.morning||!availability.all)?`<div class="hint" style="margin-top:7px">오늘은 남은 시간에 맞는 일정만 선택할 수 있습니다.</div>`:''}`)}${field('car-front','메인까지',`<div class="chips">${chip('drive',30,'약 30분')}${chip('drive',60,'약 1시간')}</div><div class="hint" style="margin-top:7px">차량 실제 이동시간 기준입니다. 약 30분은 40분까지, 약 1시간은 75분까지 포함합니다.</div>`)}<div class="concept-heading">오늘 어떤 걸 해볼까?</div><div class="concept-help">여러 가지를 고를 수 있습니다. 선택한 테마를 합쳐 최대 10곳 추천합니다.</div><div class="concept-grid">${USER_THEME_KEYS.map(conceptCard).join('')}</div>${selectedNames.length?`<div class="theme-selected-note">${icon('sparkles')} <span><b>${selectedNames.length}개 테마 선택</b> · ${esc(selectedNames.join(', '))}</span></div>`:''}<button class="primary" ${selectedNames.length?'':'disabled'} onclick="showRecommendations()">검색</button></div>`);
  requestAnimationFrame(paintIcons);
};

showRecommendations=async()=>{
  if(!S.themes.length){home();return}
  load('선택한 테마의 후보를 찾고 있어요');
  try{
    const origin=await resolveOrigin();
    const data=await api(apiUrl('theme',{...cachePoint(origin),originLabel:S.origin==='직접 입력'?S.originText.trim():'',themes:S.themes.join(','),maxMinutes:S.drive===30?40:75,visitDate:chosenDate().toISOString().slice(0,10)}));
    S.transitEnabled=data.transitEnabled;
    S.items=data.items||[];
    if(!S.items.length)throw Error('이 조건에 맞는 후보를 찾지 못했습니다. 이동시간을 넓히거나 다른 나들이 종류를 골라 주세요.');
    renderThemeItems();
  }catch(error){fail(error.message)}
};

openTheme=async key=>{S.themes=[key];S.theme=key;if(key==='culture')normalizeCultureDate();return showRecommendations()};
renderPreviews=()=>renderThemeItems();

// 네이버 지역검색의 item.link는 지도 주소가 아니라 업체가 등록한 홈페이지(인스타그램 등)다.
// 지도 버튼에는 절대 사용하지 않고, 장소명과 주소로 만든 네이버 지도 검색 주소만 사용한다.
function naverMapSearchUrl(place){
  // 상세 번지·건물층까지 넣으면 네이버 지도 검색이 오히려 실패할 수 있다.
  // 장소명과 행정구역(예: "몬스터파크 수색점 서울특별시 은평구")까지만 쓴다.
  const address=String(place.road_address||place.address||'').trim();
  const match=address.match(/^((?:[가-힣]+(?:특별시|광역시|특별자치시|특별자치도|도))\s+)?([가-힣]+(?:시|군|구))/);
  const area=match?[match[1],match[2]].map(part=>String(part||'').trim()).filter(Boolean).join(' '):address.split(/\s+/).slice(0,2).join(' ');
  const query=[place.name,area].filter(Boolean).join(' ').trim();
  return `https://map.naver.com/p/search/${encodeURIComponent(query)}`;
}
placeCard=(place,canSelect=true)=>{const programTitles=Array.isArray(place.cultural_programs)?place.cultural_programs.filter(Boolean).slice(0,3):[];const programPeriods=Array.isArray(place.cultural_program_periods)?place.cultural_program_periods.filter(Boolean).slice(0,2):[];const programSummary=programTitles.length?`<div class="program-summary"><b>진행 중인 전시 · 프로그램</b>${programTitles.map(title=>`<span class="program-title">${esc(title)}</span>`).join('')}${programPeriods.length?`<small>${esc(programPeriods.join(' · '))}</small>`:''}</div>`:'';const officialProgramTag=place.official_child_program_evidence?`<span class="tag">공식 확인 · 유아·어린이 프로그램 운영</span>`:'';return `<div class="card place"><h3>${esc(place.name)}</h3><div class="meta">${icon('car-front')} ${place.route_estimated?'예상 ':'실제 차량 약 '}${place.route_minutes}분${place.transit_minutes!=null?`<br>${icon('bus-front')} 대중교통 약 ${place.transit_minutes}분`:''} · ${esc(place.category||'장소')}<br>${esc(place.road_address||place.address||'')}</div>${officialProgramTag}${programSummary}<div class="place-actions"><a class="link-btn" target="_blank" rel="noopener" href="${naverMapSearchUrl(place)}">${icon('map-pinned')} 네이버 지도</a><a class="link-btn" target="_blank" rel="noopener" href="https://m.search.naver.com/search.naver?query=${encodeURIComponent(place.name)}">${icon('arrow-up-right')} 상세·예약</a>${canSelect?`<button class="select" onclick="chooseMain('${place.id}')">선택 ${icon('chevron-right')}</button>`:''}</div></div>`;};

// 시간대 선택 없이, 메인 하나와 필요한 보조 장소만 담는 흐름으로 마무리한다.
function ensureOptionalPicks(){
  const list=value=>Array.isArray(value)?value:(value?[value]:[]);
  S.pick={sub:list(S.pick?.sub),food:list(S.pick?.food),cafe:list(S.pick?.cafe)};
  return S.pick;
}

function optionalPickCount(){
  const picks=ensureOptionalPicks();
  return picks.sub.length+picks.food.length+picks.cafe.length;
}

home=()=>{
  navSet('home');
  if(S.themes.includes('culture'))normalizeCultureDate();
  const selectedNames=S.themes.map(key=>ALL_THEMES[key]?.[1]).filter(Boolean);
  const cultureSchedule=S.themes.includes('culture')?field('calendar-days','놀이 일정',`<div class="hint">이번 달 중 수업이 열리는 날짜를 골라 주세요. 직접 입력할 필요 없어요.</div>${cultureCalendar()}`):'';
  render(`<div class="card"><div class="concept-heading">테마 선택</div><div class="concept-help">복수 선택 가능</div><div class="concept-grid">${USER_THEME_KEYS.map(conceptCard).join('')}</div>${selectedNames.length?`<div class="theme-selected-note">${icon('sparkles')} <span><b>${selectedNames.length}개 테마 선택</b> · ${esc(selectedNames.join(', '))}</span></div>`:''}${cultureSchedule}${field('map-pin','출발지',`<div class="chips">${['현재 위치','지도에서 선택','직접 입력'].map(value=>chip('origin',value)).join('')}</div>${S.origin==='지도에서 선택'?`<div class="hint" style="margin-top:8px">${S.mapPick?'선택한 위치를 출발지로 사용합니다.':'지도를 열어 출발할 곳을 선택해 주세요.'}</div>`:''}${S.origin==='직접 입력'?`<input class="input" style="margin-top:9px" value="${esc(S.originText)}" placeholder="전국 도로명주소 또는 장소명" oninput="S.originText=this.value;S.originPos=null">`:''}`)}${field('car-front','이동시간',`<div class="chips">${chip('drive',30,'약 30분')}${chip('drive',60,'약 1시간')}</div><div class="hint" style="margin-top:7px">차량 실제 이동시간 기준입니다. 약 30분은 40분까지, 약 1시간은 75분까지 포함합니다.</div>`)}<button class="primary" ${selectedNames.length?'':'disabled'} onclick="showRecommendations()">검색</button></div>`);
  requestAnimationFrame(paintIcons);
};

renderThemeItems=()=>{
  const selectedNames=S.themes.map(key=>ALL_THEMES[key]?.[1]).filter(Boolean);
  navSet('back');
  render(`<div class="list-title"><div><div class="section" style="margin-bottom:4px">${icon('sparkles')} 선택한 테마</div><div class="theme-result-copy">${esc(selectedNames.join(', '))}</div><div class="theme-result-copy">테마 조건과 이동시간을 통과한 후보입니다.</div><div class="theme-result-copy">영업시간·예약은 각 장소의 ‘상세·예약’에서 최종 확인해 주세요.</div></div></div>${S.themes.includes('season')?`<div class="season-note">계절 운영 여부는 방문 전 각 장소에서 확인해 주세요.</div>`:''}${S.items.map(place=>placeCard(place)).join('')}`);
  requestAnimationFrame(paintIcons);
};

chooseMain=id=>{
  const place=S.items.find(item=>item.id===id);
  if(!place)return;
  S.main1=place;
  S.main2=null;
  S.second=false;
  S.pick={sub:[],food:[],cafe:[]};
  around();
};

mini=(place,type)=>{
  const selected=ensureOptionalPicks()[type].some(item=>item.id===place.id);
  return `<div class="card mini ${selected?'choice':''}"><div style="display:flex;align-items:center;gap:8px"><div style="min-width:0;flex:1"><h3>${esc(place.name)}</h3><div style="margin:1px 0 5px;color:#4d607b;font-size:12px;font-weight:750;line-height:1.45">${esc(place.nearby_summary||'메인 일정 사이에 들르기 좋은 후보')}</div><div class="meta">${icon('car-front')} 메인에서 약 ${place.route_minutes}분 · ${esc(place.category||'')}</div></div><button class="select" style="flex:0 0 78px;width:78px;min-height:44px;margin:0;padding:9px 6px" onclick="pickNear('${type}','${place.id}')">${selected?'담김':'담기'} ${icon(selected?'check':'plus')}</button></div></div>`;
};

pickNear=(type,id)=>{
  const picks=ensureOptionalPicks();
  const place=(S.near[type]||[]).find(item=>item.id===id);
  if(!place)return;
  const index=picks[type].findIndex(item=>item.id===id);
  if(index>=0)picks[type].splice(index,1); else picks[type].push(place);
  renderAround();
};

renderAround=()=>{
  const noSub='<div class="card hint">메인 주변에서 조건에 맞는 보조 콘텐츠를 찾지 못했습니다.</div>';
  const noFood='<div class="card hint">조건에 맞는 식당이 없습니다.</div>';
  const noCafe='<div class="card hint">조건에 맞는 카페가 없습니다.</div>';
  const count=optionalPickCount();
  render(`<div class="section">선택한 메인</div>${placeCard(S.main1,false)}<div class="section">추가로 담기</div><div class="hint">보조 콘텐츠·식당·카페는 모두 선택사항입니다. 필요한 곳만 담고, 다 고르면 완료를 누르세요.${count?` 현재 ${count}곳 담김.`:''}</div><div class="section">보조 콘텐츠</div><div class="hint">메인 주변의 놀이터·전시·문화·산책 후보입니다.</div>${S.near.sub.slice(0,5).map(place=>mini(place,'sub')).join('')||noSub}<div class="section">${icon('utensils')} 식당</div>${S.near.food.slice(0,5).map(place=>mini(place,'food')).join('')||noFood}<div class="section">${icon('coffee')} 카페</div>${S.near.cafe.slice(0,5).map(place=>mini(place,'cafe')).join('')||noCafe}<button class="primary" onclick="finalPlan()">완료 ${icon('check')}</button>`);
  requestAnimationFrame(paintIcons);
};

function tripTimeLabel(minutes){
  const value=Number(minutes);
  if(!Number.isFinite(value))return '이동시간 확인';
  return value<=40?'약 30분':'약 1시간';
}

function selectedItem(place,label){
  const travelLabel=label==='메인'?'출발지에서':'메인에서';
  const classSchedule=place.culture_class?[place.culture_date_label,place.culture_time,place.culture_target].filter(Boolean).join(' · '):'';
  return `<div class="card selected-item" style="display:flex;align-items:center;gap:11px"><div style="flex:0 0 49px;color:#4d607b;font-size:11px;font-weight:850">${esc(label)}</div><div style="min-width:0;flex:1"><div class="schedule-name">${esc(place.name)}</div><div class="schedule-meta">${classSchedule?`${esc(classSchedule)}<br>`:''}${travelLabel} ${tripTimeLabel(place.route_minutes)}</div></div></div>`;
}

finalPlan=()=>{
  const picks=ensureOptionalPicks();
  const sections=[['메인',[S.main1]],['보조',picks.sub],['식당',picks.food],['카페',picks.cafe]];
  render(`<div class="section">선택한 나들이</div><div class="card notice hint">담은 장소만 정리했습니다. 실제 운영시간·예약 여부는 방문 전 각 장소에서 확인해 주세요.</div>${sections.flatMap(([label,places])=>places.map(place=>selectedItem(place,label))).join('')}<button class="primary" onclick="home()">새 조건으로 검색 ${icon('refresh-cw')}</button>`);
  requestAnimationFrame(paintIcons);
};

goBack=()=>{
  if(modal.innerHTML){closeMap();return}
  if(main.querySelector('.selected-item')){renderAround();return}
  if(main.textContent.includes('선택한 메인')){renderThemeItems();return}
  if(main.querySelector('.list-title')){home();return}
  home();
};
document.querySelector('[data-page="back"]').onclick=goBack;
home();
</script><script>
// 메인 다음은 후보 목록이 아니라 '추가할 종류'를 먼저 고르는 단계형 흐름이다.
const OPTIONAL_TYPES={
  sub:{title:'보조 콘텐츠',icon:'sparkles',copy:'놀이터·전시·문화·산책 코스'},
  food:{title:'식당',icon:'utensils',copy:'메인 전후에 들를 식사 장소'},
  cafe:{title:'카페',icon:'coffee',copy:'잠깐 쉬거나 간식을 먹을 곳'}
};

function optionalPlace(type){return S.pick?.[type]||null}

function addMenuButton(type){
  const info=OPTIONAL_TYPES[type];
  return `<button class="card" style="display:flex;align-items:center;width:100%;margin:10px 0;padding:15px 16px;border:1px solid #e1e6ed;border-radius:18px;background:#fff;color:#1f2937;text-align:left" onclick="openOptionalCandidates('${type}')"><span style="display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;margin-right:11px;border-radius:13px;background:#eef4ff;color:#2769d8">${icon(info.icon)}</span><span style="min-width:0;flex:1"><b style="display:block;font-size:16px;letter-spacing:-.45px">${info.title}</b><small style="display:block;margin-top:3px;color:#718096;font-size:12px;line-height:1.35">${info.copy}</small></span>${icon('chevron-right')}</button>`;
}

function selectedOptionalSummary(type){
  const place=optionalPlace(type);
  if(!place)return '';
  return `<div style="display:flex;align-items:center;gap:7px;margin:8px 0;padding:10px 12px;border-radius:13px;background:#f2f6fd;color:#405a84;font-size:12px;font-weight:750"><span>${icon('check')}</span><span>${OPTIONAL_TYPES[type].title} · ${esc(place.name)}</span></div>`;
}

renderAddMenu=()=>{
  S.activeOptionalType=null;
  navSet('back');
  const available=Object.keys(OPTIONAL_TYPES).filter(type=>!optionalPlace(type));
  render(`<div class="section">선택한 메인</div>${placeCard(S.main1,false)}<div class="section">추가 선택</div><div class="hint">필요한 항목만 고르세요. 선택하지 않아도 되고, 다 고르면 완료를 누르면 됩니다.</div>${Object.keys(OPTIONAL_TYPES).map(selectedOptionalSummary).join('')}<div style="margin-top:12px">${available.map(addMenuButton).join('')}</div><button class="primary" onclick="finalPlan()">완료 ${icon('check')}</button>`);
  requestAnimationFrame(paintIcons);
};

around=()=>renderAddMenu();

chooseMain=id=>{
  const place=S.items.find(item=>item.id===id);
  if(!place)return;
  S.main1=place;
  S.main2=null;
  S.second=false;
  S.pick={sub:null,food:null,cafe:null};
  renderAddMenu();
};

openOptionalCandidates=async type=>{
  const info=OPTIONAL_TYPES[type];
  if(!info||!S.main1)return;
  S.activeOptionalType=type;
  load(`${info.title} 후보를 찾고 있어요`);
  try{
    const origin=cachePoint({x:S.main1.x,y:S.main1.y});
    const originLabel=S.main1.road_address||S.main1.address||S.main1.name;
    const data=await api(apiUrl('nearby',{...origin,type,originLabel}));
    S.near[type]=data.items||[];
    renderOptionalCandidates(type);
  }catch(error){fail(error.message)}
};

function optionalCandidateCard(place,type){
  const reason=type==='sub'&&place.nearby_summary?`<div class="optional-reason">${esc(place.nearby_summary)}</div>`:'';
  return `<div class="card optional-candidate"><div class="optional-candidate-row"><div class="optional-candidate-copy"><h3>${esc(place.name)}</h3>${reason}<div class="meta">${icon('car-front')} 메인에서 차량 약 ${place.route_minutes}분 · ${esc(place.category||'')}</div></div><button class="optional-add" onclick="pickNear('${type}','${place.id}')">담기 ${icon('plus')}</button></div></div>`;
}

renderOptionalCandidates=type=>{
  const info=OPTIONAL_TYPES[type];
  const places=S.near[type]||[];
  const mainName=S.main1?.name||'선택한 메인';
  const note=type==='sub'?'보조 콘텐츠는 메인 전후에 가볍게 들를 수 있는 주변 후보입니다.':'식당·카페는 메인 주변 검색 결과이며, 아이 동반 시설 여부는 방문 전 상세 페이지에서 확인해 주세요.';
  navSet('back');
  render(`<div class="optional-header"><div><div class="section">${info.title} 추가하기</div><div class="hint">${esc(mainName)} 주변의 ${info.title} 후보입니다. 한 곳만 담을 수 있어요.</div></div><button class="optional-skip" onclick="renderAddMenu()">${icon('forward')} 이번엔 건너뛰기</button></div>${places.map(place=>optionalCandidateCard(place,type)).join('')||`<div class="card hint optional-empty">조건에 맞는 ${info.title} 후보를 찾지 못했습니다.</div>`}<div class="optional-footer"><div class="optional-note">${note}</div></div>`);
  requestAnimationFrame(paintIcons);
};

pickNear=(type,id)=>{
  const place=(S.near[type]||[]).find(item=>item.id===id);
  if(!place)return;
  S.pick[type]=place;
  renderAddMenu();
};

function sharedPlanEntries(){
  return [['메인',S.main1],['보조 콘텐츠',optionalPlace('sub')],['식당',optionalPlace('food')],['카페',optionalPlace('cafe')]].flatMap(([label,place])=>(Array.isArray(place)?place:[place]).filter(Boolean).map(place=>({label,place})));
}

async function sharePlan(){
  const entries=sharedPlanEntries();
  const text=['[아이랑 어디갈까?]',...entries.map(({label,place})=>`${label} · ${place.name}${place.culture_class?` · ${[place.culture_date_label,place.culture_time].filter(Boolean).join(' ')}`:''} (${label==='메인'?'출발지':'메인'}에서 ${tripTimeLabel(place.route_minutes)})`)].join('\n');
  const data={title:'아이랑 어디갈까? 나들이',text,url:location.href};
  const fallback=async()=>{
    try{await navigator.clipboard.writeText(`${text}\n${location.href}`);alert('나들이 내용을 복사했어요.');}
    catch{window.prompt('나들이 내용을 복사하세요.',`${text}\n${location.href}`);}
  };
  if(!navigator.share){await fallback();return;}
  try{await navigator.share(data);}catch(error){if(error?.name!=='AbortError')await fallback();}
}

finalPlan=()=>{
  const entries=sharedPlanEntries();
  navSet('back');
  render(`<div class="section">선택한 나들이</div>${entries.map(({label,place})=>selectedItem(place,label)).join('')}<button class="primary" onclick="sharePlan()">${icon('share-2')} 공유하기</button>`);
  requestAnimationFrame(paintIcons);
};

goBack=()=>{
  if(modal.innerHTML){closeMap();return}
  if(S.activeOptionalType){renderAddMenu();return}
  if(main.querySelector('.selected-item')){renderAddMenu();return}
  if(main.textContent.includes('선택한 메인')){renderThemeItems();return}
  if(main.querySelector('.list-title')){home();return}
  home();
};
document.querySelector('[data-page="back"]').onclick=goBack;

async function requestThemeRecommendations(excludeIds=[]){
  const origin=await resolveOrigin();
  const isShortDrive=Number(S.drive)===30;
  return api(apiUrl('theme',{...cachePoint(origin),originLabel:S.origin==='직접 입력'?S.originText.trim():'',themes:S.themes.join(','),rangeLevel:isShortDrive?2:3,maxMinutes:isShortDrive?40:75,visitDate:S.themes.includes('culture')?S.cultureDate:'',exclude:excludeIds.join(',')}));
}

showRecommendations=async()=>{
  if(!S.themes.length){home();return}
  S.seenRecommendationIds=[];
  load('선택한 테마의 후보를 찾고 있어요');
  try{
    const data=await requestThemeRecommendations();
    S.transitEnabled=data.transitEnabled;
    S.items=data.items||[];
    if(!S.items.length)throw Error('이 조건에 맞는 후보를 찾지 못했습니다. 이동시간을 넓히거나 다른 테마를 골라 주세요.');
    renderThemeItems();
  }catch(error){fail(error.message)}
};

refreshThemeItems=async()=>{
  const excluded=[...new Set([...(S.seenRecommendationIds||[]),...S.items.map(place=>place.id)])];
  load('다른 후보를 찾고 있어요');
  try{
    const data=await requestThemeRecommendations(excluded);
    const items=data.items||[];
    if(!items.length){
      renderThemeItems();
      alert('현재 조건에서 더 보여드릴 후보가 없습니다. 이동시간이나 테마를 바꿔 보세요.');
      return;
    }
    S.seenRecommendationIds=excluded;
    S.items=items;
    renderThemeItems();
  }catch(error){fail(error.message)}
};

renderThemeItems=()=>{
  const selectedNames=S.themes.map(key=>ALL_THEMES[key]?.[1]).filter(Boolean);
  const cultureSelected=S.themes.includes('culture');
  navSet('back');
  render(`<div class="list-title"><div><div class="section selected-theme-heading">${icon('sparkles')} <span>선택한 테마</span><span class="selected-theme-badge">${esc(selectedNames.join(' · '))}</span></div>${cultureSelected?`<div class="theme-result-copy">${esc(S.cultureDate||'')}에 실제 수업 일정이 확인된 인근 대형 쇼핑몰만 보여드려요.</div>`:''}<div class="theme-result-copy">선택한 이동시간 안에서 실제 차량시간을 통과한 후보입니다.</div><div class="theme-result-copy">수업 시간·접수 상태는 공식 상세에서 최종 확인해 주세요.</div></div></div>${S.themes.includes('season')?`<div class="season-note">계절 운영 여부는 방문 전 각 장소에서 확인해 주세요.</div>`:''}${S.items.map(place=>placeCard(place)).join('')}<button class="refresh" onclick="refreshThemeItems()">${icon('refresh-cw')} 다른 후보 보기</button>`);
  requestAnimationFrame(paintIcons);
};
// 장소 검색·지도 링크는 실제 시설명을 유지하고, 카드 제목만 검증된 전시명으로 보강한다.
const basePlaceCard=placeCard;
placeCard=(place,canSelect=true)=>{
  if(place.culture_class){
    const mall=place.mall_name||place.category||'문화센터';
    const classInfo=[place.culture_date_label,place.culture_time,place.culture_target,place.culture_price].filter(Boolean).join(' · ');
    const source=place.source_url||naverMapSearchUrl({...place,name:mall});
    return `<div class="card place"><h3>${esc(place.name)}</h3><div class="meta">${icon('car-front')} ${place.route_estimated?'예상 ':'실제 차량 약 '}${place.route_minutes}분 · ${esc(mall)}<br>${esc(place.road_address||place.address||'')}</div><div class="program-summary"><b>${esc(place.culture_source||'공식 문화센터 시간표')}</b><span class="program-title">${esc(classInfo)}</span><small>${esc(place.culture_status||'공식 상세에서 접수 상태를 확인해 주세요.')}</small></div><div class="place-actions"><a class="link-btn" target="_blank" rel="noopener" href="${naverMapSearchUrl({...place,name:mall})}">${icon('map-pinned')} 쇼핑몰 지도</a><a class="link-btn" target="_blank" rel="noopener" href="${esc(source)}">${icon('arrow-up-right')} 수업 상세</a>${canSelect?`<button class="select" onclick="chooseMain('${place.id}')">선택 ${icon('chevron-right')}</button>`:''}</div></div>`;
  }
  let card=basePlaceCard(place,canSelect);
  // 과학관은 프로그램 제목이 바뀌어도 목적지가 달라지지 않으므로 시설명만 간결하게 표시한다.
  if(/과학관/.test(place.name||''))card=card.replace(/<div class="program-summary">[\s\S]*?<\/div>/,'');
  if(!place.display_name||place.display_name===place.name)return card;
  return card.replace(`<h3>${esc(place.name)}</h3>`,`<h3>${esc(place.display_name)}</h3>`);
};
</script></body></html>
